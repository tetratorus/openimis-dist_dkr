services:
  db:
    image: ghcr.io/openimis/openimis-mssql:${DB_TAG:-latest}
    init: true
    restart: always
    environment:
      - DB_USER_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set to a strong secret in .env}
      - SA_PASSWORD=${DB_SA_PASSWORD:?DB_SA_PASSWORD must be set to a strong secret in .env (distinct from DB_PASSWORD)}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - ACCEPT_EULA=${ACCEPT_EULA}
      - DEMO_DATASET=${DEMO_DATASET}
      - DB_ENGINE=mssql
    healthcheck:
      test: "bash /app/healthcheck.sh"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 100s
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    networks:
      openimis-net:
    volumes:
      - database:/var/opt/mssql/data
    ## WARNING:
    ## the database port is intentionally NOT published to the host; it is only
    ## reachable from the openimis-net network. If you need local admin access,
    ## bind it to the loopback interface only, e.g.:
    # ports:
    #   - 127.0.0.1:1433:1433
