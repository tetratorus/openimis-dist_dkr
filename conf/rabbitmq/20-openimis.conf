# Celery (worker control/"pidbox" and event queues, channel-level prefetch)
# relies on features RabbitMQ 4.3 denies by default. Both are still shipped
# but will be removed in a future major release.
# https://www.rabbitmq.com/docs/deprecated-features
deprecated_features.permit.transient_nonexcl_queues = true
deprecated_features.permit.global_qos = true
